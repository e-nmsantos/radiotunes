name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unitários (RocCore + i18n) e end-to-end num Chrome headless
      # (o runner ubuntu-latest já traz o google-chrome).
      - name: Testes
        run: node --test "test/*.test.mjs"
