name: Saúde do Catálogo (streams + logos)

on:
  schedule:
    - cron: '0 8 * * 1'   # todas as segundas-feiras às 08:00 UTC
  workflow_dispatch:      # também executável manualmente no GitHub

permissions:
  issues: write
  contents: write   # o agente committa reparações e remoções (manutenção autónoma)

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manutenção do catálogo (reparar streams, eliminar irrecoveráveis)
        run: node tools/health-check.cjs --fix --prune || echo "DEAD_FOUND=true" >> "$GITHUB_ENV"

      - name: Commit das alterações do agente (se houver)
        if: env.DEAD_FOUND == 'true'
        run: |
          if ! git diff --quiet js/catalog.js; then
            git config user.name "roc-waves-agent"
            git config user.email "actions@users.noreply.github.com"
            git add js/catalog.js
            git commit -m "chore(agent): manutenção automática — streams reparados/removidos

Generated by Mistral Vibe.
Co-Authored-By: Mistral Vibe <vibe@mistral.ai>"
            git push
            echo "AGENT_COMMIT=true" >> "$GITHUB_ENV"
          fi

      - name: Gravar relatório como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: tools/reports/
          if-no-files-found: ignore

      - name: Abrir/atualizar issue com falhas
        if: env.DEAD_FOUND == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🩺 Catálogo: estações com streams/logos em falha"
          EXISTING=$(gh issue list --state open --search "in:title ${TITLE}" --json number -q '.[0].number')
          AGENT_NOTE=""
          if [ "${AGENT_COMMIT}" = "true" ]; then AGENT_NOTE="

          🤖 O agente já reparou/eliminou o que foi seguro — as falhas abaixo são outages transitórios ou casos que exigem decisão humana."; fi
          BODY="# 🩺 Auditoria automática de $(date -u +'%Y-%m-%d %H:%M UTC')

          $(cat tools/reports/summary.md)
          ${AGENT_NOTE}

          ---
          _Gerado pelo workflow_ **Saúde do Catálogo**. Para reparar: \`node tools/health-check.cjs --fix --prune\` localmente, ou clicar em_ *Run workflow* _após corrigir._"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi
